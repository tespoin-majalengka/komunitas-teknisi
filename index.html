<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrasi Acara</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

:root{
  --black:#0b0f14;
  --yellow:#ffc107;
  --bg:#f3f5f7;
  --white:#ffffff;
  --text:#17202a;
  --muted:#6b7280;
  --border:#e5e7eb;
}

html,body{
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

/* HEADER */
.header{
  height:64px;
  background:var(--black);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 16px;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 2px 8px rgba(0,0,0,.18);
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:800;
  font-size:18px;
}

.brand-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:var(--yellow);
  color:var(--black);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:900;
}

.menu-btn{
  width:44px;
  height:44px;
  border:0;
  border-radius:10px;
  background:transparent;
  cursor:pointer;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:5px;
}

.menu-btn span{
  width:24px;
  height:3px;
  border-radius:3px;
  background:#fff;
  transition:.2s;
}

.menu-btn:hover{
  background:rgba(255,255,255,.08);
}

/* SIDE MENU */
.overlay{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.42);
  opacity:0;
  visibility:hidden;
  transition:.2s;
  z-index:1100;
}

.overlay.show{
  opacity:1;
  visibility:visible;
}

.sidebar{
  position:fixed;
  top:0;
  right:-310px;
  width:min(310px,86vw);
  height:100vh;
  background:#fff;
  z-index:1200;
  box-shadow:-8px 0 25px rgba(0,0,0,.2);
  transition:.25s ease;
  display:flex;
  flex-direction:column;
}

.sidebar.open{
  right:0;
}

.sidebar-head{
  min-height:74px;
  background:var(--black);
  color:#fff;
  padding:15px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.sidebar-title{
  font-weight:800;
  font-size:18px;
}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:9px;
  background:rgba(255,255,255,.08);
  color:#fff;
  font-size:26px;
  cursor:pointer;
}

.menu-list{
  padding:12px;
  overflow-y:auto;
}

.menu-item{
  width:100%;
  border:0;
  background:#fff;
  min-height:58px;
  border-radius:12px;
  margin-bottom:8px;
  padding:10px 12px;
  display:flex;
  align-items:center;
  gap:12px;
  text-align:left;
  cursor:pointer;
  color:var(--text);
  font-size:15px;
  font-weight:700;
}

.menu-item:hover{
  background:#f5f5f5;
}

.menu-icon{
  width:38px;
  height:38px;
  border-radius:10px;
  background:#f1f3f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  flex:none;
}

.menu-text{
  flex:1;
}

.menu-arrow{
  color:#9ca3af;
  font-size:18px;
}

/* MAIN */
main{
  min-height:calc(100vh - 64px);
  display:flex;
  flex-direction:column;
}

/*
  AREA ACARA SENGAJA KOSONG.
  Nanti akan diisi otomatis dari Pengaturan Acara.
*/
.event-display{
  width:100%;
  min-height:calc(100vh - 64px);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.empty-state{
  width:min(520px,100%);
  text-align:center;
  padding:40px 24px;
  border:1px dashed #cbd5e1;
  border-radius:18px;
  background:#fff;
}

.empty-icon{
  width:70px;
  height:70px;
  margin:0 auto 18px;
  border-radius:18px;
  background:#f1f3f5;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:32px;
}

.empty-state h2{
  font-size:20px;
  margin-bottom:8px;
}

.empty-state p{
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translate(-50%,20px);
  background:var(--black);
  color:#fff;
  padding:12px 18px;
  border-radius:10px;
  font-size:14px;
  opacity:0;
  visibility:hidden;
  transition:.2s;
  z-index:2000;
  max-width:90%;
  text-align:center;
}

.toast.show{
  opacity:1;
  visibility:visible;
  transform:translate(-50%,0);
}

/* RESPONSIVE */
@media(max-width:480px){
  .header{
    height:60px;
  }

  .brand{
    font-size:16px;
  }

  .brand-icon{
    width:34px;
    height:34px;
  }

  .event-display{
    min-height:calc(100vh - 60px);
    padding:16px;
  }

  .empty-state{
    padding:32px 18px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="brand">
    <div class="brand-icon">R</div>
    <div>REGISTRASI ACARA</div>
  </div>

  <button class="menu-btn" id="menuBtn" aria-label="Buka menu">
    <span></span>
    <span></span>
    <span></span>
  </button>
</header>

<div class="overlay" id="overlay"></div>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div class="sidebar-title">MENU</div>
    <button class="close-btn" id="closeBtn" aria-label="Tutup menu">×</button>
  </div>

  <nav class="menu-list">

    <button class="menu-item" onclick="openPage('Registrasi Acara')">
      <div class="menu-icon">📝</div>
      <div class="menu-text">Registrasi Acara</div>
      <div class="menu-arrow">›</div>
    </button>

    <button class="menu-item" onclick="openPage('Cek Registrasi')">
      <div class="menu-icon">🔎</div>
      <div class="menu-text">Cek Registrasi</div>
      <div class="menu-arrow">›</div>
    </button>

    <button class="menu-item" onclick="openPage('Approval Peserta')">
      <div class="menu-icon">✅</div>
      <div class="menu-text">Approval Peserta</div>
      <div class="menu-arrow">›</div>
    </button>

    <button class="menu-item" onclick="openPage('Pengaturan Acara')">
      <div class="menu-icon">⚙️</div>
      <div class="menu-text">Pengaturan Acara</div>
      <div class="menu-arrow">›</div>
    </button>

  </nav>
</aside>

<main>
  <section class="event-display" id="eventDisplay">

    <!--
      AREA INI AKAN MENJADI DINAMIS.

      Nantinya:
      - Nama acara diambil dari Pengaturan Acara
      - Banner acara diambil dari Pengaturan Acara
      - Tanggal acara diambil dari Pengaturan Acara
      - Informasi biaya/tier diambil dari Pengaturan Acara

      Untuk sekarang sengaja kosong.
    -->

    <div class="empty-state">
      <div class="empty-icon">📅</div>
      <h2>Belum Ada Acara</h2>
      <p>
        Tampilan acara akan muncul di halaman ini setelah
        acara dibuat melalui <b>Pengaturan Acara</b>.
      </p>
    </div>

  </section>
</main>

<div class="toast" id="toast"></div>

<!-- FIREBASE -->

    "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBwHjyapmcsvIff_HrGyHsxGrJTl-7CHTo",

    projectId: "teknisi-ponsel-maja",
    storageBucket: "teknisi-ponsel-maja.firebasestorage.app",
    messagingSenderId: "835618012205",
    appId: "1:835618012205:web:95e41095d1a56c761d4ca4"
  };

  const app = initializeApp(firebaseConfig);

  // Firebase sudah terhubung.
  // Firestore akan kita sambungkan ketika halaman
  // Pengaturan Acara dan Registrasi dibuat.

  console.log("Firebase berhasil diinisialisasi:", app.name);

<script>
const menuBtn = document.getElementById("menuBtn");
const closeBtn = document.getElementById("closeBtn");
const sidebar = document.getElementById("sidebar");
const overlay = document.getElementById("overlay");
const toast = document.getElementById("toast");

function openMenu(){
  sidebar.classList.add("open");
  overlay.classList.add("show");
  document.body.style.overflow = "hidden";
}

function closeMenu(){
  sidebar.classList.remove("open");
  overlay.classList.remove("show");
  document.body.style.overflow = "";
}

menuBtn.addEventListener("click", openMenu);
closeBtn.addEventListener("click", closeMenu);
overlay.addEventListener("click", closeMenu);

document.addEventListener("keydown", function(e){
  if(e.key === "Escape"){
    closeMenu();
  }
});

function showToast(message){
  toast.textContent = message;
  toast.classList.add("show");

  clearTimeout(window.toastTimer);
  window.toastTimer = setTimeout(() => {
    toast.classList.remove("show");
  }, 2200);
}

/*
  Sementara menu hanya menampilkan informasi.
  Nanti masing-masing diarahkan ke halaman:
  registrasi.html
  cek-registrasi.html
  approval-peserta.html
  pengaturan-acara.html
*/
function openPage(page){
  closeMenu();

  const routes = {
    "Registrasi Acara": "registrasi.html",
    "Cek Registrasi": "cek-registrasi.html",
    "Approval Peserta": "approval-peserta.html",
    "Pengaturan Acara": "pengaturan-acara.html"
  };

  if(routes[page]){
    // Untuk sekarang halaman belum dibuat.
    showToast(page + " — halaman berikutnya akan dibuat.");
    // window.location.href = routes[page];
  }
}
</script>

</body>
</html>
